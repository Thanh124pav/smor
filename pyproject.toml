[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smor"
version = "0.1.0"
description = "SMOR Module 1: learner-agnostic online data reweighting / utility estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "tqdm>=4.60",
    "h5py>=3.8",       # read official RoboMimic HDF5 datasets
    "requests>=2.28",  # download RoboMimic datasets
]

[project.optional-dependencies]
# Optional classic-control env backend; the built-in point-mass env needs none of this.
gym = ["gymnasium>=0.29"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]
# Optional: real robosuite/MuJoCo rollout eval for RoboMimic (success rate). Training + the
# held-out val-loss evaluation need only h5py (a core dep), never this.
robomimic = ["robomimic>=0.3", "robosuite>=1.4"]

[tool.setuptools.packages.find]
include = ["smor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
